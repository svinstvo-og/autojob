<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>CV</title>
  <style>
    @page {
      size: A4;
      margin: 14mm 16mm 14mm 16mm;
    }
    * {
      box-sizing: border-box;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      font-size: 10pt;
      line-height: 1.42;
      color: #1f2937;
      margin: 0;
      padding: 0;
    }
    h1 {
      font-size: 20pt;
      font-weight: 700;
      color: #111827;
      margin: 0 0 4px 0;
      letter-spacing: -0.02em;
    }
    h2 {
      font-size: 11.5pt;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: #1e3a8a;
      border-bottom: 1.5px solid #cbd5e1;
      padding-bottom: 3px;
      margin: 14px 0 6px 0;
    }
    h3 {
      font-size: 10.5pt;
      font-weight: 600;
      color: #111827;
      margin: 8px 0 2px 0;
    }
    p {
      margin: 0 0 6px 0;
    }
    ul {
      margin: 3px 0 8px 0;
      padding-left: 18px;
    }
    li {
      margin-bottom: 3px;
    }
    em {
      color: #4b5563;
      font-size: 9.5pt;
    }
    strong {
      color: #111827;
    }
    a {
      color: #2563eb;
      text-decoration: none;
    }
    hr {
      border: none;
      border-top: 1px solid #e5e7eb;
      margin: 10px 0;
    }
  </style>
</head>
<body>
{{.Body}}
</body>
</html>
